[package]
name = "er-save-editor"
version = "0.0.24"
edition = "2021"

[dependencies]
aes = "0.9.0"
binary-reader = "0.4.5"
bitflags = "2.11.1"
cbc = "0.2.0"
eframe = "0.34.2"
egui-phosphor = { version = "0.12.0", features = ["regular", "fill"] }
egui_extras = "0.34.2"
encoding_rs = "0.8.35"
env_logger = "0.11.10"
image = "0.25.10"
md5 = "0.8.0"
once_cell = "1.21.4"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
rfd = "0.17.2"
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strsim = "0.11.1"
zstd = "0.13.3"
flate2 = "1.1.9"
zune-inflate = "0.2.54"

[build-dependencies]
winres = "0.1.12"
